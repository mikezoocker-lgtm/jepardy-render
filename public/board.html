<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz – Board</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-role="board">

<!-- SPLASH -->
<div class="splash" id="splash">
  <div class="splashInner">
    <img src="logo.png" alt="Quiz Logo" class="splashLogo">
  </div>
</div>

<div class="app">

  <div class="centerLogo">
    <img src="logo.png" alt="Quiz Logo">
  </div>

  <section class="playersPanel">
    <div class="joinBar">
      <input id="joinName" type="text" placeholder="Dein Name…" autocomplete="off">
      <button class="btn" id="joinBtn">Beitreten</button>
    </div>

    <div class="playersHeader">
      <h2>Spieler</h2>
    </div>

    <div class="players" id="players"></div>
  </section>

  <div class="board" id="board"></div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modalTop">
      <div class="meta">
        <div class="tag">
          <b id="modalCategory">Kategorie</b> ·
          <span id="modalValue">100</span> Punkte
        </div>
        <div class="question" id="modalQuestion"></div>
      </div>
    </div>

    <div class="answer" id="modalAnswer"></div>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
